name: Build

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: self-hosted
    env:
      YARN_CACHE_FOLDER: ${{ github.workspace }}/build/.yarn-cache

    steps:
      - name: Clean workspace
        run: rm -rf *

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: ./.github/actions/setup-nvm

      - name: Restore caches
        uses: ./.github/actions/cache-deps
        with:
          operation: restore
          job-type: build

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Save caches
        uses: ./.github/actions/cache-deps
        with:
          operation: save
          job-type: build

      - name: Clean workspace
        if: always()
        run: rm -rf *
