name: Unit Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  tests:
    name: Unit Tests
    runs-on: self-hosted
    env:
      YARN_CACHE_FOLDER: ${{ github.workspace }}/test/.yarn-cache

    steps:
      - name: Clean workspace
        run: rm -rf *

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: ./.github/actions/setup-nvm

      - name: Restore caches
        uses: ./.github/actions/cache-deps
        with:
          operation: restore
          job-type: test

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Save caches
        uses: ./.github/actions/cache-deps
        with:
          operation: save
          job-type: test

      - name: Run Unit tests
        run: yarn test

      - name: Clean workspace
        if: always()
        run: rm -rf *
