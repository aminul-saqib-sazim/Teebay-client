name: Unit Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  tests:
    name: Unit Tests
    runs-on: self-hosted
    env:
      YARN_CACHE_FOLDER: ${{ github.workspace }}/test/.yarn-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: ./.github/actions/setup-nvm

      - name: Clean yarn cache
        run: yarn cache clean

      - name: Cache yarn dependencies
        id: yarn-cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-yarn-deps-test-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-deps-test-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Unit tests
        run: yarn test
